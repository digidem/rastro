# Complemento do compose GERADO do template (rastro_caprover_sim.py): o PostgreSQL
# "existente" (o preparo roda no serviço <app>-setup DO template) e a sonda. Mesma rede interna.
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_PASSWORD: ${SIM_PG_ADMIN_PW}
    networks:
      sim:
        aliases: [srv-captain--postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  # Frente TLS como o nginx do CapRover: termina HTTPS e passa X-Forwarded-Proto.
  # Dois vhosts na 443 (como os subdomínios do CapRover): srv-captain--front para
  # o web e sim-mqtt.sim.local para o broker — alias extra aponta para ESTA frente,
  # e o nginx faz proxy ao listener 9001 do broker com Upgrade de WebSocket.
  front:
    image: nginx:1.27-alpine
    volumes:
      - ${SIM_FRONT}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SIM_FRONT}/certs:/certs:ro
    networks:
      sim:
        aliases: [srv-captain--front, sim-mqtt.sim.local]

  probe:
    image: communityfirst/rastro-ingest:${SIM_TAG}
    profiles: [probe]
    entrypoint: ["python", "/sim/probe.py"]
    environment:
      SIM_APP: ${SIM_APP}
      SIM_DB: ${SIM_DB}
      SIM_PREFIX: rastro
      SIM_CA: /sim/pki/ca.crt
      SIM_BROKER: srv-captain--${SIM_APP}-broker
      SIM_PG_HOST: srv-captain--postgres
      SIM_WEB_URL: http://srv-captain--${SIM_APP}
      SIM_FRONT_URL: https://srv-captain--front
      SIM_FRONT_CA: /sim/front-ca.crt
      # Host do vhost MQTT da frente: cliente WSS → nginx (SNI sim-mqtt.sim.local)
      # → proxy com Upgrade → listener 9001 do broker, como o gateway em produção.
      SIM_FRONT_WS_HOST: sim-mqtt.sim.local
      SIM_PW_GATEWAY: ${SIM_PW_GATEWAY}
      SIM_PW_INGEST: ${SIM_PW_INGEST}
      SIM_PW_MQTT_INGEST: ${SIM_PW_MQTT_INGEST}
      SIM_PW_VIEWER: ${SIM_PW_VIEWER}
      SIM_PW_MAINT: ${SIM_PW_MAINT}
      SIM_API_TOKEN: ${SIM_API_TOKEN}
    volumes:
      - ${SIM_PROBE}:/sim/probe.py:ro
      - sim-pki:/sim/pki:ro
      - ${SIM_FRONT}/certs/ca.crt:/sim/front-ca.crt:ro
    networks: [sim]
