# Constrói e publica as 5 imagens do Rastro no GHCR com a MESMA tag.
# - push em main: tag sha-<curto>
# - tag git vX.Y.Z: tag X.Y.Z e latest
# Os pacotes GHCR nascem privados: torná-los públicos é passo manual da publicação
# (senão o CapRover precisa de credencial de registry).
name: images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: broker
            context: broker
            file: broker/Dockerfile
          - name: ingest
            context: services
            file: services/rastro_gateway/Dockerfile
          - name: api
            context: services
            file: services/rastro_api/Dockerfile
          - name: web
            context: web
            file: web/Dockerfile
          - name: pgtools
            context: .
            file: deploy/postgres/Dockerfile
            pg: "17"
            pg_image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          - name: pgtools
            context: .
            file: deploy/postgres/Dockerfile
            pg: "16"
            pg_image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          - name: pgtools
            context: .
            file: deploy/postgres/Dockerfile
            pg: "15"
            pg_image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
          - name: pgtools
            context: .
            file: deploy/postgres/Dockerfile
            pg: "14"
            pg_image: postgres:14-alpine@sha256:4ea9e5ed06591da7ea23eb65465e8d3187fe79f4d5ec3ae976d29a33b013e77a
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rastro-${{ matrix.name }}
          # pgtools: um sufixo -pg<major> por versão do servidor (ex. 0.1.0-pg16)
          flavor: |
            suffix=${{ matrix.pg && format('-pg{0}', matrix.pg) || '' }},onlatest=true
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            ${{ matrix.pg_image && format('PG_IMAGE={0}', matrix.pg_image) || '' }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
