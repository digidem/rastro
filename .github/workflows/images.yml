# Testa e publica as 5 imagens do Rastro no Docker Hub (communityfirst/rastro-*) com a MESMA tag.
# - push em main: tag sha-<curto>
# - tag git vX.Y.Z: tag X.Y.Z e latest
# Segredos do repositório (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  usuário do Docker Hub com permissão de escrita na organização communityfirst
#   DOCKERHUB_TOKEN     access token do Docker Hub (escopo Read & Write); nunca a senha da conta
# Os repositórios communityfirst/rastro-{broker,ingest,api,web,pgtools} precisam existir e ser
# públicos no Docker Hub (senão o CapRover precisa de credencial de registry).
name: images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rastro
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: rastro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rastro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RASTRO_PG_HOST: 127.0.0.1
      RASTRO_PG_PORT: "5432"
      RASTRO_PG_USER: rastro
      RASTRO_PG_PASSWORD: teste
      RASTRO_API_TOKEN: teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
      - name: Testes do gateway/ingest
        run: |
          pip install -e 'services/rastro_gateway[dev]'
          pytest -q services/rastro_gateway
      - name: Testes da API
        run: |
          pip install -e 'services/rastro_api[dev]'
          pytest -q services/rastro_api
      - name: Viewer (lint, testes, build)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: broker
            context: broker
            file: broker/Dockerfile
          - name: ingest
            context: services
            file: services/rastro_gateway/Dockerfile
          - name: api
            context: services
            file: services/rastro_api/Dockerfile
          - name: web
            context: web
            file: web/Dockerfile
          - name: pgtools
            context: .
            file: deploy/postgres/Dockerfile
            pg: "17"
            pg_image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          - name: pgtools
            context: .
            file: deploy/postgres/Dockerfile
            pg: "16"
            pg_image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          - name: pgtools
            context: .
            file: deploy/postgres/Dockerfile
            pg: "15"
            pg_image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
          - name: pgtools
            context: .
            file: deploy/postgres/Dockerfile
            pg: "14"
            pg_image: postgres:14-alpine@sha256:4ea9e5ed06591da7ea23eb65465e8d3187fe79f4d5ec3ae976d29a33b013e77a
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/communityfirst/rastro-${{ matrix.name }}
          # pgtools: um sufixo -pg<major> por versão do servidor (ex. 0.1.0-pg16)
          flavor: |
            suffix=${{ matrix.pg && format('-pg{0}', matrix.pg) || '' }},onlatest=true
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            ${{ matrix.pg_image && format('PG_IMAGE={0}', matrix.pg_image) || '' }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
